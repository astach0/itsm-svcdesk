# ai-generated: 70% - merged the course Lab 3 Compose template with the existing Lab 2 configuration using AI assistance.
# Keep the Lab 2 tests, test clock, named volume and svcdesk healthcheck.

services:
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["tests"]
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      BASE_URL: http://svcdesk:8080

  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      KB_INDEX_URL: http://kb-index:8080
    volumes:
      - svcdesk-data:/data
    depends_on:
      - kb-index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: "astach0"
    ports:
      - "8081:8080"
    # Intentionally no healthcheck: the image has no shell or curl.

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ai-generated: 100% - optional Toxiproxy service for Lab 3 latency-gap measurement
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0"]
    profiles: ["gap"]
    ports:
      - "8474:8474"
      - "8666:8666"

volumes:
  svcdesk-data:
