# Course template - Lab 1/Lab 2 compose contract.
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts, and images that need no network once built.

services:
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["tests"]
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      BASE_URL: http://svcdesk:8080

  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  svcdesk-data:
